name: Planner regression tests
on:
  push:
    branches: [feature/affirmation-history]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        state-column: [data, payload]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: planner-test
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PLANNER_TEST_STATE_COLUMN: ${{ matrix.state-column }}
      PLANNER_TEST_DATABASE_URL: postgresql://postgres:planner-test@127.0.0.1:5432/planner_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
